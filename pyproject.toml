[project]
name = "sikorius"
version = "0.1.0"
description = "Aplicación con interfaz gráfica para crear, visualizar y usar modelos de regresión lineal a partir de CSV, Excel y SQLite"
readme = "README.md"
authors = [
    { name = "xabier.pcabanas", email = "xabier.pcabanas@udc.es" },
    { name = "hugo.costa.bouzada", email = "hugo.costa.bouzada@udc.es" },
    { name = "raul.pita.seoane", email = "raul.pita.seoane@udc.es" },
    { name = "pepe.lopez.martinez", email = "pepe.lopez.martinez@udc.es" }
]
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.18.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "streamlit>=1.66.0",
    "xlrd>=2.0.2",
]

[project.scripts]
sikorius = "sikorius:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
